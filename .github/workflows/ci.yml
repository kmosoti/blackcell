name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Semantic naming
        uses: ast-grep/action@d9518f632658f9c7c4b4dd4df22e98388a0d2c68
        with:
          version: "0.45.0"
          config: sgconfig.yml
          paths: src tests tools examples .github/workflows/ci.yml
      - name: Structural rule probes
        shell: bash
        run: |
          probe_rule() {
            expected_rule="$1"
            probe="$2"
            set +e
            output="$(
              printf '%s\n' "$probe" \
                | ast-grep scan \
                    --rule architecture/ast-grep/python-semantic-names.yml \
                    --stdin \
                    --json=compact \
                    2>/dev/null
            )"
            status=$?
            set -e
            if [ "$status" -ne 1 ] \
              || ! grep -Fq "\"ruleId\":\"$expected_rule\"" <<<"$output"; then
              exit 1
            fi
          }

          probe_rule \
            python-maturity-labelled-identifier \
            "$(printf '%s%s_%s = 1' al pha review)"
          probe_rule \
            python-generation-labelled-identifier \
            "$(printf 'class Engine%s%s: pass' V 3)"
          probe_rule \
            python-retired-source-evidence-label \
            "$(printf 'marker = \"%s_%s\"' release evidence)"
      - name: Configure Bubblewrap sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor-profiles bubblewrap
          sudo apparmor_parser --replace /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          /usr/bin/bwrap \
            --unshare-all \
            --die-with-parent \
            --ro-bind / / \
            --proc /proc \
            --dev /dev \
            /usr/bin/true
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - name: Architecture fitness
        run: >-
          uv run python tools/run_pytest.py
          tests/architecture/test_dependencies.py
          -q --blackcell-require-all-pass
      - name: Full test suite
        run: uv run python tools/run_pytest.py --cov=blackcell --cov-report=term-missing

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ty check
