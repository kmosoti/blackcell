project:
  key: BCP
  name: BlackCell
  description: Evidence-grounded, project-scoped software execution with durable assurance.

principles:
  - Keep one immutable event ledger and content-addressed artifact store.
  - Treat models as replaceable proposal mechanisms without ambient tool authority.
  - Keep project, intent, plan, run, execution, review, verification, and replay distinct.
  - Preserve conflicts, counterevidence, unknowns, effective time, and provenance.
  - Gate every effect through typed host-owned policy and acceptance commands.
  - Distinguish historical replay from any operation that can repeat a side effect.
  - Fail closed on incompatible persisted state without automatic migration or deletion.
  - Use capability names for executable architecture; revisions belong only to real boundaries.

capability_graph:
  entry: project
  terminal: verification
  nodes:
    project:
      owns: canonical repository identity and configuration binding
    intent:
      owns: objective, constraints, assumptions, and unresolved questions
    plan:
      owns: dependency graph, budgets, effects, paths, and acceptance commands
    run:
      owns: asynchronous submission, cancellation, status, and event identity
    execution:
      owns: fenced claims, isolated worktrees, provider dispatch, checks, and cleanup
    review:
      owns: independent defect search and epistemic findings
    verification:
      owns: deterministic acceptance and epistemic evidence matrix
    replay:
      owns: live-free reconstruction and artifact-integrity checks
  edges:
    - [project, intent]
    - [intent, plan]
    - [plan, run]
    - [run, execution]
    - [execution, review]
    - [review, verification]
    - [run, replay]
    - [execution, replay]
    - [review, replay]
    - [verification, replay]

runtime:
  composition_root: blackcell-runtime
  foreground_components:
    - api
    - execution-worker
    - review-worker
    - verification-worker
  client_surfaces:
    - JSON-first CLI
    - PyRatatui terminal UI
    - Litestar browser UI
  cli_commands:
    - blackcell project register
    - blackcell intent accept
    - blackcell plan accept
    - blackcell run submit
    - blackcell run status
    - blackcell run query
    - blackcell run cancel
    - blackcell run replay
    - blackcell events list
    - blackcell tui
  http_contract:
    routes:
      - /api/v1/projects
      - /api/v1/intents
      - /api/v1/plans
      - /api/v1/runs
      - /api/v1/events
      - /api/v1/ui
    browser: /ui
  optional_configuration:
    execution: BLACKCELL_EXECUTION_CONFIG_FILE
    review: BLACKCELL_REVIEW_CONFIG_FILE
    verification: BLACKCELL_VERIFICATION_CONFIG_FILE
  project_configuration:
    provider: Kernform
    supported_package_version: "0.2.0"
    wire_schema: kernform.command/v2
    transport: argv-only subprocess

epistemic_guard:
  review_dimensions:
    - acceptance-coverage
    - evidence-grounding
    - counterevidence
    - causal-overreach
    - scope-challenge
    - uncertainty
  verification_outcomes:
    - pass
    - fail
    - inconclusive
  rules:
    - Every finding cites admitted evidence.
    - Every declared acceptance criterion has a verification row.
    - Missing evidence remains unknown and cannot be promoted to pass.
    - Human acceptance remains separate from model review and deterministic verification.

architecture_policy:
  retired_runtime_roots: architecture/dependency_rules.json
  executable_names:
    maturity_labels: forbidden
    speculative_generation_labels: forbidden
  compatibility:
    old_routes: forbidden
    old_environment_variables: forbidden
    import_reexports: forbidden
    automatic_database_migration: forbidden
    automatic_database_deletion: forbidden
  genuine_revision_boundaries:
    - public HTTP contracts
    - persisted schemas and events
    - package and dependency metadata
    - isolated third-party adapters

verification:
  architecture_gate: >-
    uv run python tools/run_pytest.py
    tests/architecture/test_dependencies.py
    -q --blackcell-require-all-pass
  format_gate: uv run ruff format --check .
  lint_gate: uv run ruff check .
  type_gate: uv run ty check
  full_gate: uv run python tools/run_pytest.py --cov=blackcell --cov-report=term-missing

historical_context:
  - docs/adr
  - docs/decisions
  - docs/spec
  - experiments
